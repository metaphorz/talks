<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talks — Paul Fishwick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#20252B;--grey:#5B636B;--teal:#1D6E73;--amber:#C9852F;--paper:#F7F3EA;--rule:#E3D9C6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans","Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:64px 16px}
h1{margin:0 0 6px;font-size:34px}
.sub{margin:0 0 36px;color:var(--grey)}
ul{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--rule)}
li{border-bottom:1.5px solid var(--rule)}
a{display:block;padding:18px 4px;color:inherit;text-decoration:none}
a:hover .t{color:var(--teal)}
.k{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--amber)}
.t{display:block;margin-top:4px;font-size:20px;font-weight:700}
.d{display:block;margin-top:2px;color:var(--grey)}
</style>
</head>
<body>
<main>
  <h1>Talks</h1>
  <p class="sub">Slide decks in HTML. Arrow keys or click to advance · F fullscreen · P presenter view.</p>
  <ul>
    <li><a href="deeplookingweek3/">
      <span class="k">Deep Looking · Week 3</span>
      <span class="t">Making Connections</span>
      <span class="d">Relations between two things — and what it takes to see them.</span>
    </a></li>
  </ul>
</main>
</body>
</html>
